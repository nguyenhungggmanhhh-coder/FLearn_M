<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sửa lịch học')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/classes">Lớp học</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{'/admin/classes/' + ${classroom.classId}}"
                           th:text="${classroom.className}">Lớp</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{'/admin/classes/' + ${classroom.classId} + '/schedules'}">Lịch học</a>
                    </li>
                    <li class="breadcrumb-item active">Sửa lịch</li>
                </ol>
            </nav>

            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <section class="panel">
                        <div class="panel-header">
                            <h1 class="panel-title h5 mb-0">
                                <i class="bi bi-pencil-square me-2"></i>Chỉnh sửa lịch học
                            </h1>
                        </div>
                        <div class="panel-body">
                            <form th:action="@{'/admin/classes/' + ${classroom.classId} + '/schedules/' + ${schedule.id} + '/edit'}"
                                  method="post" th:object="${scheduleRequest}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="dayOfWeek">Thứ trong tuần <span class="text-danger">*</span></label>
                                    <select class="form-select" id="dayOfWeek" th:field="*{dayOfWeek}" required>
                                        <option th:each="entry : ${daysOfWeek}"
                                                th:value="${entry.key}"
                                                th:text="${entry.value}">Thứ 2</option>
                                    </select>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col">
                                        <label class="form-label fw-semibold" for="startTime">Giờ bắt đầu <span class="text-danger">*</span></label>
                                        <input type="time" class="form-control" id="startTime"
                                               th:field="*{startTime}" required>
                                    </div>
                                    <div class="col">
                                        <label class="form-label fw-semibold" for="endTime">Giờ kết thúc</label>
                                        <input type="time" class="form-control" id="endTime"
                                               th:field="*{endTime}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="roomOrLink">Phòng / Link học</label>
                                    <input type="text" class="form-control" id="roomOrLink"
                                           th:field="*{roomOrLink}"
                                           placeholder="VD: Phòng A205 hoặc https://meet.google.com/...">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="note">Ghi chú</label>
                                    <textarea class="form-control" id="note" th:field="*{note}" rows="3"
                                              placeholder="Nội dung buổi học, yêu cầu chuẩn bị..."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Cài đặt nhắc nhở email</label>
                                    <div class="form-check mb-1">
                                        <input class="form-check-input" type="checkbox" id="remindOneDay"
                                               th:field="*{remindOneDayBefore}">
                                        <label class="form-check-label" for="remindOneDay">
                                            <i class="bi bi-bell-fill text-warning me-1"></i>Nhắc trước 1 ngày
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="remindTwoHours"
                                               th:field="*{remindTwoHoursBefore}">
                                        <label class="form-check-label" for="remindTwoHours">
                                            <i class="bi bi-alarm-fill text-info me-1"></i>Nhắc trước 2 tiếng
                                        </label>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-brand flex-grow-1">
                                        <i class="bi bi-floppy-fill me-2"></i>Lưu thay đổi
                                    </button>
                                    <a th:href="@{'/admin/classes/' + ${classroom.classId} + '/schedules'}"
                                       class="btn btn-outline-secondary">
                                        <i class="bi bi-x-lg me-1"></i>Hủy
                                    </a>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
