<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Đăng ký giảng viên mới')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('lecturers')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark">Thêm giảng viên mới</h1>
                    <p class="page-subtitle">Tạo tài khoản dành cho giáo viên để họ có thể quản lý lớp học và tài liệu.</p>
                </div>
                <a th:href="@{/admin/lecturers}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Quay lại danh sách
                </a>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <section class="panel">
                        <div class="panel-body p-4 p-md-5">
                            <h4 class="fw-bold mb-4 text-dark text-center"><i class="bi bi-person-plus-fill me-2 text-primary"></i>Thông tin tài khoản</h4>
                            <form th:action="@{/admin/lecturers/create}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Tên đăng nhập (Username) <span class="text-danger">*</span></label>
                                    <input class="form-control form-control-lg" name="username" placeholder="Nhập username..." required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input class="form-control form-control-lg" name="password" type="password" placeholder="Nhập mật khẩu..." required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                                    <input class="form-control form-control-lg" name="fullName" placeholder="Nhập họ và tên đầy đủ..." required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                                    <input class="form-control form-control-lg" name="email" type="email" placeholder="email@flearn.com" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                    <input class="form-control form-control-lg" name="phone" placeholder="Nhập số điện thoại liên lạc...">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Bộ môn</label>
                                    <input class="form-control form-control-lg" name="department" placeholder="Ví dụ: Công nghệ thông tin, Toán học...">
                                </div>
                                <div class="mt-5">
                                    <button type="submit" class="btn btn-brand btn-lg w-100">Xác nhận tạo tài khoản</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
