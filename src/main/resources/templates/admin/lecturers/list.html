<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Quản lý giảng viên')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('lecturers')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark">Quản lý Giảng viên</h1>
                    <p class="page-subtitle">Thêm mới, tìm kiếm, cập nhật và khóa/mở khóa tài khoản giáo viên.</p>
                </div>
                <form th:action="@{/admin/lecturers}" method="get" class="d-flex gap-2">
                    <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm giảng viên...">
                    <button class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
                    <a th:href="@{/admin/lecturers/create}" class="btn btn-brand d-flex align-items-center gap-2" style="white-space: nowrap;">
                        <i class="bi bi-plus-lg"></i> Thêm giảng viên
                    </a>
                </form>
            </div>
            
            <div class="row g-4">
                <!-- Lecturers List Column -->
                <div class="col-xl-12">
                    <section class="panel">
                        <div class="panel-body p-0">
                            <div class="p-3 border-bottom bg-white d-flex align-items-center">
                                <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-list-stars me-2 text-primary"></i>Danh sách giảng viên</h5>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>Giảng viên</th>
                                        <th>Email & SĐT</th>
                                        <th>Bộ môn</th>
                                        <th>Trạng thái</th>
                                        <th style="min-width: 130px;">Hành động</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="teacher : ${teachers}">
                                        <td>
                                            <div class="fw-bold text-dark" th:text="${teacher.fullName}">Name</div>
                                            <small class="text-muted"><i class="bi bi-person"></i> [[${teacher.username}]]</small>
                                        </td>
                                        <td>
                                            <div th:text="${teacher.email}">email</div>
                                            <small class="text-muted" th:text="${teacher.phone != null and teacher.phone != '' ? teacher.phone : 'Chưa có SĐT'}">phone</small>
                                        </td>
                                        <td th:text="${teacher.department != null and teacher.department != '' ? teacher.department : '-'}">CNTT</td>
                                        <td>
                                            <span class="badge-status" 
                                                  th:classappend="${teacher.status == 'BLOCKED' ? ' badge-blocked' : ' badge-active'}" 
                                                  th:text="${teacher.status}">ACTIVE</span>
                                        </td>
                                        <td>
                                            <div class="d-flex gap-2">
                                                <!-- Edit button (Modal trigger) -->
                                                <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#editTeacherModal' + ${teacher.userId}">
                                                    <i class="bi bi-pencil-square"></i> Sửa
                                                </button>
                                                
                                                <!-- Block / Unblock form -->
                                                <form th:if="${teacher.status != 'BLOCKED'}" th:action="@{'/admin/lecturers/' + ${teacher.userId} + '/block'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn KHÓA tài khoản giảng viên này?');">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                    <button class="btn btn-sm btn-outline-danger"><i class="bi bi-lock-fill"></i> Khóa</button>
                                                </form>
                                                <form th:if="${teacher.status == 'BLOCKED'}" th:action="@{'/admin/lecturers/' + ${teacher.userId} + '/unblock'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn MỞ KHÓA tài khoản giảng viên này?');">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                    <button class="btn btn-sm btn-outline-success"><i class="bi bi-unlock-fill"></i> Mở</button>
                                                </form>
                                            </div>
                                            
                                            <!-- Edit Teacher Modal -->
                                            <div class="modal fade" th:id="'editTeacherModal' + ${teacher.userId}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title fw-bold">Cập nhật thông tin giảng viên</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <form th:action="@{'/admin/lecturers/' + ${teacher.userId} + '/update'}" method="post">
                                                            <div class="modal-body text-start">
                                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold">Họ và Tên</label>
                                                                    <input class="form-control" name="fullName" th:value="${teacher.fullName}" required>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold">Email</label>
                                                                    <input class="form-control" name="email" type="email" th:value="${teacher.email}" required>
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                                                    <input class="form-control" name="phone" th:value="${teacher.phone}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label fw-semibold">Bộ môn</label>
                                                                    <input class="form-control" name="department" th:value="${teacher.department}">
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                                                                <button type="submit" class="btn btn-brand">Lưu thay đổi</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(teachers)}">
                                        <td colspan="5">
                                            <div class="empty-state text-muted text-center py-4">Không tìm thấy giảng viên nào.</div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
