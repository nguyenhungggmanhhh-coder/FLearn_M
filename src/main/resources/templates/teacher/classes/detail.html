<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Chi tiết lớp học')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="breadcrumb-wrapper">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/teacher/classes">Lớp học</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Chi tiết lớp</li>
                    </ol>
                </nav>
            </div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark" th:text="${classroom.className}">Class</h1>
                    <p class="page-subtitle">
                        Mã tham gia: 
                        <strong class="text-primary" th:if="${classroom.isJoinable}" th:text="${classroom.classCode}">CODE</strong>
                        <strong class="text-danger" th:unless="${classroom.isJoinable}"><i class="bi bi-lock-fill"></i> Đã khóa</strong>
                        · Trạng thái: <span class="badge bg-success" th:text="${classroom.status}">ACTIVE</span>
                    </p>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <form th:action="@{'/teacher/classes/' + ${classroom.classId} + '/toggle-joinable'}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-warning" th:if="${classroom.isJoinable}">
                            <i class="bi bi-lock-fill me-2"></i>Khóa mã
                        </button>
                        <button type="submit" class="btn btn-outline-success" th:unless="${classroom.isJoinable}">
                            <i class="bi bi-unlock-fill me-2"></i>Mở mã
                        </button>
                    </form>
                    <a class="btn btn-outline-primary" th:href="@{'/teacher/classes/' + ${classroom.classId} + '/enrollments'}">
                        <i class="bi bi-person-check-fill me-2"></i>Duyệt yêu cầu
                    </a>
                    <a class="btn btn-brand" th:href="@{'/teacher/classes/' + ${classroom.classId} + '/roadmaps'}">
                        <i class="bi bi-file-earmark-slides me-2"></i>Xem học liệu
                    </a>
                </div>
            </div>
            
            <form th:action="@{'/teacher/classes/' + ${classroom.classId}}" method="get" class="panel mb-4">
                <div class="panel-body d-flex gap-2">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input class="form-control border-start-0" name="keyword" th:value="${keyword}" placeholder="Nhập tên hoặc email học sinh để tìm kiếm trong lớp...">
                    </div>
                    <button class="btn btn-primary px-4">Tìm kiếm</button>
                </div>
            </form>
            
            <section class="panel">
                <div class="panel-body p-0">
                    <div class="p-3 border-bottom bg-white d-flex align-items-center">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-people-fill me-2 text-primary"></i>Danh sách học viên hoạt động</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Sinh viên</th>
                                <th>Email</th>
                                <th>Ngày gia nhập</th>
                                <th style="width: 180px;">Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="enrollment : ${students}">
                                <td>
                                    <div class="fw-bold text-dark" th:text="${enrollment.student.fullName}">Student</div>
                                    <small class="text-muted"><i class="bi bi-person"></i> [[${enrollment.student.username}]]</small>
                                </td>
                                <td th:text="${enrollment.student.email}">email</td>
                                <td th:text="${#dates.format(enrollment.approvedAt, 'dd/MM/yyyy HH:mm')}">date</td>
                                <td>
                                    <form th:action="@{'/teacher/classes/' + ${classroom.classId} + '/students/' + ${enrollment.student.userId} + '/remove'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn đưa học viên này ra khỏi lớp? Học viên sẽ bị xóa khỏi lớp nhưng không mất tài khoản.');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-person-dash-fill me-1"></i>Đưa ra khỏi lớp
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="4">
                                    <div class="empty-state text-muted text-center py-4">Chưa có học viên nào tham gia lớp này.</div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
