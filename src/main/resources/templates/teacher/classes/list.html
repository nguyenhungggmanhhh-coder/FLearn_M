<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Lớp học của tôi')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="page-title text-dark">Lớp học của tôi</h1>
                    <p class="page-subtitle">Xem danh sách các lớp học được phân công và quản lý học viên.</p>
                </div>
            </div>
            
            <div class="row g-4">
                <div class="col-md-6 col-xl-4" th:each="classroom : ${classes}">
                    <article class="class-card d-flex flex-column">
                        <div class="card-body p-4 flex-grow-1 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                                    <div>
                                    <h2 class="h5 fw-bold mb-1 text-dark text-truncate" style="max-width: 200px;" th:text="${classroom.className}">Class</h2>
                                    <div class="text-muted small">Mã lớp: 
                                        <strong class="text-secondary" th:if="${classroom.isJoinable}" th:text="${classroom.classCode}">CODE</strong>
                                        <strong class="text-danger" th:unless="${classroom.isJoinable}"><i class="bi bi-lock-fill"></i> Đã khóa</strong>
                                    </div>
                                    <!-- [FEAT-04] Invite code status -->
                                    <div class="mt-1">
                                        <span class="badge rounded-pill"
                                              th:if="${classroom.inviteCodeVisible}"
                                              style="font-size:0.68rem; background:#d1fae5; color:#065f46;">
                                            <i class="bi bi-eye-fill me-1"></i>Mã mời: đang hiển
                                        </span>
                                        <span class="badge rounded-pill"
                                              th:unless="${classroom.inviteCodeVisible}"
                                              style="font-size:0.68rem; background:#f3f4f6; color:#6b7280;">
                                            <i class="bi bi-eye-slash-fill me-1"></i>Mã mời: đang ẩn
                                        </span>
                                    </div>

                                    </div>
                                </div>
                                    <span class="badge-status align-self-start"
                                          th:classappend="${classroom.status == 'ACTIVE' ? ' badge-active' : (classroom.status == 'CLOSED' ? ' badge-closed' : ' badge-inactive')}"
                                          th:text="${classroom.status}">ACTIVE</span>
                                </div>
                                <p class="text-muted small mb-4" style="height: 4.5em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;" th:text="${classroom.description != null and !#strings.isEmpty(classroom.description) ? classroom.description : 'Chưa có mô tả chi tiết cho lớp học này.'}">Description</p>
                            </div>
                            
                            <div class="pt-3 border-top d-flex flex-wrap align-items-center gap-2">
                                <a class="btn btn-sm btn-outline-secondary px-3" th:href="@{'/teacher/classes/' + ${classroom.classId}}">
                                    <i class="bi bi-person-lines-fill"></i> Chi tiết
                                </a>
                                <a class="btn btn-sm btn-brand px-3" th:href="@{'/teacher/classes/' + ${classroom.classId} + '/roadmaps'}">
                                    <i class="bi bi-file-earmark-slides"></i> Học liệu
                                </a>
                                
                                <div class="dropdown ms-auto">
                                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                                        <li>
                                            <a class="dropdown-item py-2" th:href="@{'/teacher/classes/' + ${classroom.classId} + '/enrollments'}">
                                                <i class="bi bi-check-circle me-2 text-success"></i>Duyệt đăng ký
                                            </a>
                                        </li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li>
                                            <form th:action="@{'/teacher/classes/' + ${classroom.classId} + '/toggle-joinable'}" method="post" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="dropdown-item py-2" th:if="${classroom.isJoinable}"><i class="bi bi-lock-fill me-2 text-warning"></i>Khóa mã tham gia</button>
                                                <button class="dropdown-item py-2" th:unless="${classroom.isJoinable}"><i class="bi bi-unlock-fill me-2 text-success"></i>Mở mã tham gia</button>
                                            </form>
                                        </li>
                                        <li>
                                            <form th:action="@{'/teacher/classes/' + ${classroom.classId} + '/toggle'}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn Thay đổi trạng thái Hoạt động/Tắt lớp học này?');" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="dropdown-item py-2"><i class="bi bi-toggle-on me-2 text-secondary"></i>Bật/Tắt hoạt động</button>
                                            </form>
                                        </li>
                                        <li>
                                            <form th:action="@{'/teacher/classes/' + ${classroom.classId} + '/delete'}" method="post" onsubmit="return confirm('CẢNH BÁO: Bạn có chắc chắn muốn ĐÓNG lớp học này? Học sinh sẽ không thể tham gia nữa.');" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button class="dropdown-item py-2 text-danger"><i class="bi bi-x-octagon me-2"></i>Đóng lớp</button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
                
                <div th:if="${#lists.isEmpty(classes)}" class="col-12">
                    <div class="empty-state text-muted py-5">
                        <i class="bi bi-journal-x fs-1 mb-3 d-block text-muted"></i>
                        Không có lớp học nào được gán cho bạn. Vui lòng liên hệ Admin.
                    </div>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
