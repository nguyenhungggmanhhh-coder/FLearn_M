<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Sửa câu hỏi - FLearn')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            
            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/teacher/classes}">Lớp học</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/teacher/quizzes/{id}/edit(id=${quizId})}">Cấu hình Quiz</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Sửa câu hỏi</li>
                </ol>
            </nav>

            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
            <div class="page-header"><h1 class="page-title">Sửa câu hỏi</h1></div>
    <form class="panel" th:action="@{/teacher/questions/{id}/edit(id=${questionId})}" th:object="${questionRequest}" method="post">
        <div class="panel-body row g-3">
            <div class="col-md-4">
                <label class="form-label">Loại</label>
                <select class="form-select" th:field="*{type}">
                    <option th:each="type : ${questionTypes}" th:value="${type}" th:text="${type}">TYPE</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Thứ tự</label>
                <input class="form-control" type="number" th:field="*{orderIndex}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Đáp án đúng</label>
                <select class="form-select" th:field="*{correctAnswer}">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="TRUE">TRUE</option>
                    <option value="FALSE">FALSE</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Nội dung</label>
                <textarea class="form-control" rows="3" th:field="*{questionText}" required></textarea>
            </div>
            <div class="col-md-6"><input class="form-control" th:field="*{optionA}" placeholder="Đáp án A"></div>
            <div class="col-md-6"><input class="form-control" th:field="*{optionB}" placeholder="Đáp án B"></div>
            <div class="col-md-6"><input class="form-control" th:field="*{optionC}" placeholder="Đáp án C"></div>
            <div class="col-md-6"><input class="form-control" th:field="*{optionD}" placeholder="Đáp án D"></div>
            <div class="col-12"><button class="btn btn-brand" type="submit">Lưu câu hỏi</button></div>
        </div>
    </form>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
