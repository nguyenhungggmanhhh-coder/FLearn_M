<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Kết quả quiz - FLearn')}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        
        <main class="app-shell flex-grow-1 p-4">
            
            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/teacher/classes}">Lớp học</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/teacher/quizzes/{id}/edit(id=${quiz.quizId})}">Cấu hình Quiz</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Kết quả thi</li>
                </ol>
            </nav>

            <div class="page-header">
                <h1 class="page-title">Kết quả bài làm</h1>
                <p class="page-subtitle" th:text="${quiz.title}">Quiz</p>
            </div>
    <section class="panel">
        <div class="panel-body table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Student</th><th>Điểm</th><th>Đúng</th><th>Lần</th><th>Trạng thái</th><th>Nộp lúc</th></tr></thead>
                <tbody>
                <tr th:each="result : ${results}">
                    <td th:text="${result.student.fullName}">Student</td>
                    <td>
                        <span class="badge bg-primary rounded-pill fs-6" th:text="${result.score}">10</span>
                    </td>
                    <td th:text="${result.correctCount + '/' + result.totalQuestions}">1/1</td>
                    <td><span class="badge bg-secondary rounded-pill" th:text="${'Lần ' + result.attemptNo}">Lần 1</span></td>
                    <td>
                        <span class="badge-status" 
                              th:classappend="${result.status == 'SUBMITTED' ? ' badge-active' : ' badge-pending'}"
                              th:text="${result.status}">SUBMITTED</span>
                    </td>
                    <td th:text="${result.submittedAt != null ? #dates.format(result.submittedAt, 'dd/MM/yyyy HH:mm') : '-'}">time</td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}"><td colspan="6"><div class="empty-state">Chưa có bài nộp.</div></td></tr>
                </tbody>
            </table>
        </div>
    </section>
        </main>
        
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
