<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${material.title})}"></head>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/student/classes">Lớp học</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/student/lessons/{id}(id=${material.lessonId})}">Bài học</a>
                    </li>
                    <li class="breadcrumb-item active" th:text="${material.title}">Tài liệu</li>
                </ol>
            </nav>

            <!-- Giới hạn độ rộng nội dung -->
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9">
                    <section class="panel">
                        <div class="panel-body p-4">

                            <!-- Header: type badge + tiêu đề + viewed status -->
                            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                                <div>
                                    <!-- Type badge -->
                                    <span class="badge rounded-pill mb-2 d-inline-block"
                                          style="font-size:0.75rem;font-weight:700;letter-spacing:.04em;padding:5px 14px;"
                                          th:classappend="${material.type != null and (material.type.name() == 'YOUTUBE_LINK' or material.type.name() == 'VIDEO') ?
                                                          'text-bg-warning' :
                                                          (material.type != null and material.type.name() == 'PDF' ?
                                                          'text-bg-danger' : 'text-bg-info')}"
                                          th:text="${material.type}">TYPE</span>
                                    <h1 class="page-title text-dark mb-1" th:text="${material.title}">Tài liệu</h1>
                                    <p class="page-subtitle mb-0"
                                       th:text="${#strings.isEmpty(material.description) ? 'Chưa có mô tả.' : material.description}">
                                        Description
                                    </p>
                                </div>
                                <!-- Viewed badge -->
                                <span class="badge-status flex-shrink-0"
                                      th:classappend="${material.viewed != null and material.viewed ? ' badge-active' : ' badge-pending'}"
                                      th:text="${material.viewed != null and material.viewed ? 'ĐÃ XEM' : 'MỚI'}">MỚI</span>
                            </div>

                            <hr class="my-3">

                            <!-- ===== VIDEO EMBED (YouTube / Google Drive) ===== -->
                            <div th:if="${material.embedUrl != null}" class="mb-4">
                                <h2 class="h6 fw-semibold text-muted mb-3">
                                    <i class="bi bi-play-circle-fill text-danger me-2"></i>Xem video
                                </h2>
                                <div style="position:relative;width:100%;padding-bottom:56.25%;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 4px 24px rgba(0,0,0,.18);">
                                    <iframe th:src="${material.embedUrl}"
                                            style="position:absolute;inset:0;width:100%;height:100%;border:none;"
                                            allowfullscreen
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                            referrerpolicy="strict-origin-when-cross-origin"></iframe>
                                </div>
                            </div>

                            <!-- ===== PDF EMBED ===== -->
                            <div th:if="${material.embedUrl == null and not #strings.isEmpty(material.filePath) and material.type.name() == 'PDF'}" class="mb-4">
                                <h2 class="h6 fw-semibold text-muted mb-3">
                                    <i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>Xem tài liệu PDF
                                </h2>
                                <div style="width:100%;height:70vh;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 2px 12px rgba(0,0,0,.06);">
                                    <iframe th:src="${material.filePath}" style="width:100%;height:100%;border:none;"></iframe>
                                </div>
                            </div>

                            <!-- ===== LINK BUTTONS ===== -->
                            <div class="d-flex flex-wrap gap-2 mb-4">
                                <a th:if="${not #strings.isEmpty(material.externalUrl)}"
                                   class="btn btn-outline-primary"
                                   th:href="${material.externalUrl}"
                                   target="_blank">
                                    <i class="bi bi-box-arrow-up-right me-2"></i>
                                    <span th:if="${material.embedUrl != null}">Mở trong tab mới</span>
                                    <span th:unless="${material.embedUrl != null}">Mở link</span>
                                </a>
                                <a th:if="${not #strings.isEmpty(material.filePath) and material.type.name() != 'PDF'}"
                                   class="btn btn-outline-success"
                                   th:href="${material.filePath}"
                                   target="_blank">
                                    <i class="bi bi-download me-2"></i>Tải file
                                </a>
                            </div>

                            <!-- ===== ĐÁNH DẤU ĐÃ XEM ===== -->
                            <div class="pt-3 border-top">
                                <form th:unless="${material.viewed != null and material.viewed}"
                                      th:action="@{/student/materials/{id}/mark-viewed(id=${material.id})}"
                                      method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-brand px-4">
                                        <i class="bi bi-check2-square me-2"></i>Đánh dấu đã xem
                                    </button>
                                </form>
                                <div th:if="${material.viewed != null and material.viewed}"
                                     class="d-flex align-items-center gap-2 text-success fw-semibold">
                                    <i class="bi bi-check-circle-fill fs-5"></i>
                                    <span>Bạn đã xem tài liệu này</span>
                                </div>
                            </div>

                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
