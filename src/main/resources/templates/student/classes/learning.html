<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Học liệu lớp học')}"></head>
<style>
/* ─── Page Banner ─── */
.learning-banner {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-radius: 20px;
    padding: 28px 32px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: relative;
    overflow: hidden;
}
.learning-banner::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(249,115,22,.25) 0%, transparent 70%);
    border-radius: 50%;
}
.learning-banner::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 20%;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(251,191,36,.12) 0%, transparent 70%);
    border-radius: 50%;
}
.learning-banner h1 {
    color: #fff;
    font-size: 1.55rem;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -.02em;
}
.learning-banner p { color: rgba(255,255,255,.6); font-size: .88rem; margin: 0; }

/* ─── Roadmap Card ─── */
.roadmap-card {
    background: #fff;
    border-radius: 20px;
    border: 1.5px solid #f0f0f0;
    box-shadow: 0 2px 16px rgba(0,0,0,.07);
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
}
.roadmap-card:hover {
    transform: translateY(-7px) scale(1.01);
    box-shadow: 0 20px 48px rgba(249,115,22,.16);
}
.roadmap-card-header {
    background: linear-gradient(140deg, #f97316 0%, #fb923c 55%, #fbbf24 100%);
    padding: 22px 22px 16px;
    position: relative;
    overflow: hidden;
}
.roadmap-card-header::before,
.roadmap-card-header::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
}
.roadmap-card-header::before { width: 90px; height: 90px; top: -30px; right: -20px; }
.roadmap-card-header::after  { width: 50px; height: 50px; bottom: -15px; left: 12px; }
.roadmap-card-header h2 {
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    margin: 0 0 6px;
    text-shadow: 0 1px 4px rgba(0,0,0,.2);
    position: relative;
}
.roadmap-card-header p {
    color: rgba(255,255,255,.82);
    font-size: .78rem;
    margin: 0;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    position: relative;
}
.published-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,.22);
    border: 1px solid rgba(255,255,255,.45);
    color: #fff;
    border-radius: 999px;
    font-size: .66rem;
    font-weight: 800;
    padding: 3px 11px;
    letter-spacing: .06em;
    backdrop-filter: blur(6px);
    white-space: nowrap;
    flex-shrink: 0;
    position: relative;
}

/* ─── Lesson count bar ─── */
.lesson-count-bar {
    background: #f8faff;
    border-bottom: 1px solid #eef0f5;
    padding: 9px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.lesson-count-bar .count-badge {
    background: #e8f0fe;
    color: #1a56db;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 800;
    padding: 2px 9px;
}

/* ─── Lesson row ─── */
.lesson-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid #f5f5f5;
    text-decoration: none;
    color: inherit;
    transition: background .15s, padding-left .18s cubic-bezier(.34,1.56,.64,1);
    position: relative;
}
.lesson-row:last-child { border-bottom: none; }
.lesson-row::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(#f97316, #fbbf24);
    border-radius: 0 3px 3px 0;
    opacity: 0;
    transition: opacity .15s;
}
.lesson-row:hover { background: #fff8f3; padding-left: 24px; }
.lesson-row:hover::before { opacity: 1; }
.lesson-row:hover .lesson-go { opacity: 1; transform: translateX(4px); }
.lesson-num {
    min-width: 30px; height: 30px;
    background: linear-gradient(135deg,#f97316,#fb923c);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 800;
    box-shadow: 0 2px 6px rgba(249,115,22,.35);
    flex-shrink: 0;
}
.lesson-title {
    flex-grow: 1;
    font-size: .85rem;
    font-weight: 600;
    color: #1f2937;
    line-height: 1.3;
}
.lesson-go {
    color: #f97316;
    font-size: .82rem;
    opacity: 0;
    transition: opacity .15s, transform .2s cubic-bezier(.34,1.56,.64,1);
}

/* ─── Empty lesson ─── */
.no-lesson {
    text-align: center;
    padding: 28px 16px;
    color: #9ca3af;
    font-size: .82rem;
}

/* ─── Stagger animation ─── */
@keyframes riseIn {
    from { opacity: 0; transform: translateY(28px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.stagger-item { animation: riseIn .45s both cubic-bezier(.34,1.56,.64,1); }
</style>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width:0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/student/classes">Lớp học</a></li>
                    <li class="breadcrumb-item active">Học liệu pre-class</li>
                </ol>
            </nav>

            <!-- Dark hero banner -->
            <div class="learning-banner">
                <div style="position:relative;z-index:1;">
                    <h1><i class="bi bi-journals me-2 opacity-75"></i>Học liệu pre-class</h1>
                    <p>Chỉ hiển thị roadmap đã publish và lesson đang visible dành cho bạn.</p>
                </div>
                <a class="btn btn-warning fw-bold px-4 py-2 flex-shrink-0"
                   href="/student/learning-history"
                   style="border-radius:12px;box-shadow:0 4px 16px rgba(251,191,36,.45);position:relative;z-index:1;">
                    <i class="bi bi-clock-history me-2"></i>Lịch sử học
                </a>
            </div>

            <!-- Roadmap cards grid -->
            <div class="row g-4">
                <div class="col-md-6 col-xl-4 stagger-item"
                     th:each="roadmap, stat : ${roadmaps}"
                     th:style="|animation-delay:${stat.index * 90}ms|">
                    <div class="roadmap-card">
                        <!-- Gradient header -->
                        <div class="roadmap-card-header">
                            <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                                <h2 th:text="${roadmap.title}">Roadmap</h2>
                                <span class="published-chip">
                                    <i class="bi bi-patch-check-fill"></i> PUBLISHED
                                </span>
                            </div>
                            <p th:text="${#strings.isEmpty(roadmap.description) ? 'Chưa có mô tả cho roadmap này.' : roadmap.description}">Mô tả</p>
                        </div>

                        <!-- Lesson count -->
                        <div class="lesson-count-bar">
                            <i class="bi bi-list-ul text-primary" style="font-size:.9rem;"></i>
                            <span class="count-badge" th:text="${#lists.size(roadmap.lessons)}">0</span>
                            <span class="text-muted" style="font-size:.78rem;font-weight:600;">bài học</span>
                        </div>

                        <!-- Lessons -->
                        <div class="flex-grow-1" th:unless="${#lists.isEmpty(roadmap.lessons)}">
                            <a th:each="lesson : ${roadmap.lessons}"
                               th:href="@{/student/lessons/{id}(id=${lesson.lessonId})}"
                               class="lesson-row">
                                <span class="lesson-num" th:text="${lesson.orderIndex}">1</span>
                                <span class="lesson-title" th:text="${lesson.title}">Lesson title</span>
                                <i class="bi bi-chevron-right lesson-go"></i>
                            </a>
                        </div>
                        <div th:if="${#lists.isEmpty(roadmap.lessons)}" class="no-lesson flex-grow-1">
                            <i class="bi bi-inbox d-block" style="font-size:2rem;margin-bottom:8px;opacity:.35;"></i>
                            Chưa có lesson visible.
                        </div>
                    </div>
                </div>

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(roadmaps)}" class="col-12">
                    <div class="text-center py-5 my-3">
                        <div style="width:80px;height:80px;background:linear-gradient(135deg,#fff7f0,#fef3c7);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:18px;">
                            📚
                        </div>
                        <h5 class="fw-bold text-dark">Chưa có học liệu</h5>
                        <p class="text-muted">Lớp này chưa có roadmap được publish.</p>
                        <a href="/student/classes" class="btn btn-outline-secondary mt-1">
                            <i class="bi bi-arrow-left me-2"></i>Quay lại lớp học
                        </a>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
