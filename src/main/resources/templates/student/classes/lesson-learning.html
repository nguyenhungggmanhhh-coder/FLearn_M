<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${lesson.title})}"></head>
<style>
/* ─── Lesson Hero ─── */
.lesson-hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #1e3a5f 100%);
    border-radius: 20px;
    padding: 28px 32px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
}
.lesson-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(249,115,22,.3) 0%, transparent 68%);
    border-radius: 50%;
}
.lesson-hero::after {
    content: '';
    position: absolute;
    bottom: -60px; left: 30%;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(59,130,246,.18) 0%, transparent 70%);
    border-radius: 50%;
}
.lesson-num-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(249,115,22,.25);
    border: 1px solid rgba(249,115,22,.45);
    color: #fb923c;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: .74rem;
    font-weight: 800;
    letter-spacing: .06em;
    margin-bottom: 10px;
}
.lesson-hero h1 {
    color: #fff;
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -.02em;
    position: relative;
}
.lesson-hero p {
    color: rgba(255,255,255,.55);
    font-size: .88rem;
    margin: 0;
    position: relative;
}

/* ─── Section card ─── */
.section-card {
    background: #fff;
    border-radius: 18px;
    border: 1.5px solid #f0f0f0;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
    overflow: hidden;
}
.section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1.5px solid #f0f0f0;
    background: #fafbff;
}
.section-header-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
}
.section-header h2 {
    font-size: 1rem;
    font-weight: 800;
    color: #1f2937;
    margin: 0;
}
.section-header .count-chip {
    background: #e8f0fe;
    color: #1a56db;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 800;
    padding: 2px 9px;
    margin-left: auto;
}

/* ─── Material row ─── */
.material-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    border-bottom: 1px solid #f5f5f5;
    transition: background .14s;
}
.material-row:last-child { border-bottom: none; }
.material-row:hover { background: #fafbff; }
.mat-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem;
    flex-shrink: 0;
}
.mat-icon-yt   { background: #fee2e2; color: #dc2626; }
.mat-icon-pdf  { background: #fee2e2; color: #dc2626; }
.mat-icon-doc  { background: #dbeafe; color: #2563eb; }
.mat-icon-link { background: #d1fae5; color: #059669; }
.mat-icon-vid  { background: #fee2e2; color: #dc2626; }
.mat-info { flex-grow: 1; min-width: 0; }
.mat-info .mat-title {
    font-size: .88rem;
    font-weight: 700;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.mat-info .mat-type {
    font-size: .72rem;
    color: #6b7280;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
}
.viewed-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #d1fae5;
    color: #059669;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 800;
    padding: 3px 11px;
    white-space: nowrap;
    flex-shrink: 0;
}
.new-chip {
    background: #fff3cd;
    color: #92400e;
    border-radius: 999px;
    font-size: .68rem;
    font-weight: 800;
    padding: 3px 11px;
    white-space: nowrap;
    flex-shrink: 0;
}
.open-btn {
    background: linear-gradient(135deg,#f97316,#fb923c);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 6px 14px;
    font-size: .78rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 8px rgba(249,115,22,.3);
}
.open-btn:hover {
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(249,115,22,.4);
}

/* ─── Quiz card ─── */
.quiz-item {
    padding: 18px 22px;
    border-bottom: 1px solid #f5f5f5;
}
.quiz-item:last-child { border-bottom: none; }
.quiz-title { font-weight: 800; color: #111827; font-size: .9rem; margin-bottom: 3px; }
.quiz-desc  { color: #6b7280; font-size: .78rem; margin-bottom: 10px; }
.quiz-meta  {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
}
.quiz-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f3f4f6;
    color: #374151;
    border-radius: 8px;
    padding: 3px 10px;
    font-size: .74rem;
    font-weight: 600;
}
.quiz-meta-item.orange { background:#fff7ed; color:#c2410c; }
.quiz-actions { display: flex; gap: 8px; }
.btn-quiz-do {
    background: linear-gradient(135deg,#f97316,#fb923c);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 7px 18px;
    font-size: .8rem;
    font-weight: 700;
    text-decoration: none;
    flex-grow: 1;
    text-align: center;
    transition: opacity .15s;
    box-shadow: 0 2px 8px rgba(249,115,22,.3);
}
.btn-quiz-do:hover { color:#fff; opacity:.9; }
.btn-quiz-result {
    color: #6b7280;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    padding: 7px 14px;
    font-size: .8rem;
    font-weight: 600;
    text-decoration: none;
    flex-grow: 1;
    text-align: center;
    transition: border-color .14s;
}
.btn-quiz-result:hover { border-color:#f97316; color:#f97316; }

/* ─── Video ─── */
.video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 8px 32px rgba(0,0,0,.22);
}
.video-wrapper iframe {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
    border: none;
}

/* ─── Stagger ─── */
@keyframes riseIn {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
}
.si { animation: riseIn .4s both; }
.si-1 { animation-delay: 0ms; }
.si-2 { animation-delay: 80ms; }
.si-3 { animation-delay: 160ms; }
</style>
<body class="bg-light">
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar('classes')}"></div>
    <div class="flex-grow-1 d-flex flex-column" style="min-width:0;">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <main class="app-shell flex-grow-1 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/student/classes">Lớp học</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/student/classes/{id}/learning(id=${lesson.classId})}">Học liệu</a>
                    </li>
                    <li class="breadcrumb-item active" th:text="${lesson.title}">Bài học</li>
                </ol>
            </nav>

            <!-- Lesson dark hero -->
            <div class="lesson-hero si si-1">
                <div style="position:relative;z-index:1;">
                    <div class="lesson-num-badge">
                        <i class="bi bi-bookmark-fill"></i>
                        <span th:text="|Lesson ${lesson.orderIndex}|">Lesson 1</span>
                    </div>
                    <h1 th:text="${lesson.title}">Tên bài học</h1>
                    <p th:text="${#strings.isEmpty(lesson.content) ? 'Chưa có mô tả chi tiết.' : lesson.content}">Mô tả</p>
                </div>
            </div>

            <!-- Video bài học (nếu có) -->
            <div class="section-card mb-4 si si-1" th:if="${lesson.embedVideoUrl != null}">
                <div class="section-header">
                    <div class="section-header-icon" style="background:#fee2e2;">
                        <i class="bi bi-play-circle-fill text-danger"></i>
                    </div>
                    <h2>Video bài học</h2>
                </div>
                <div class="p-3">
                    <div class="video-wrapper">
                        <iframe th:src="${lesson.embedVideoUrl}"
                                allowfullscreen
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                </div>
            </div>

            <!-- 2-cột: tài liệu + quiz -->
            <div class="row g-4">
                <!-- Tài liệu -->
                <div class="col-lg-7 si si-2">
                    <div class="section-card h-100">
                        <div class="section-header">
                            <div class="section-header-icon" style="background:#dbeafe;">
                                <i class="bi bi-files text-primary"></i>
                            </div>
                            <h2>Tài liệu học tập</h2>
                            <span class="count-chip" th:text="${#lists.size(materials) + ' tài liệu'}">0</span>
                        </div>

                        <div th:unless="${#lists.isEmpty(materials)}">
                            <div class="material-row" th:each="mat : ${materials}">
                                <!-- Icon -->
                                <div class="mat-icon"
                                     th:classappend="${mat.type != null and mat.type.name() == 'YOUTUBE_LINK' ? 'mat-icon-yt' :
                                                     (mat.type != null and mat.type.name() == 'VIDEO' ? 'mat-icon-vid' :
                                                     (mat.type != null and mat.type.name() == 'PDF' ? 'mat-icon-pdf' :
                                                     (mat.type != null and mat.type.name() == 'DOCUMENT' ? 'mat-icon-doc' : 'mat-icon-link')))}">
                                    <i class="bi"
                                       th:classappend="${mat.type != null and mat.type.name() == 'YOUTUBE_LINK' ? 'bi-youtube' :
                                                       (mat.type != null and mat.type.name() == 'VIDEO' ? 'bi-camera-video-fill' :
                                                       (mat.type != null and mat.type.name() == 'PDF' ? 'bi-file-earmark-pdf-fill' :
                                                       (mat.type != null and mat.type.name() == 'DOCUMENT' ? 'bi-file-earmark-word-fill' : 'bi-link-45deg')))}"></i>
                                </div>
                                <!-- Info -->
                                <div class="mat-info">
                                    <div class="mat-title" th:text="${mat.title}">Title</div>
                                    <div class="mat-type" th:text="${mat.type}">TYPE</div>
                                </div>
                                <!-- Status -->
                                <span class="viewed-chip" th:if="${mat.viewed != null and mat.viewed}">
                                    <i class="bi bi-check-circle-fill"></i> Đã xem
                                </span>
                                <span class="new-chip" th:unless="${mat.viewed != null and mat.viewed}">MỚI</span>
                                <!-- CTA -->
                                <a class="open-btn" th:href="@{/student/materials/{id}(id=${mat.id})}">
                                    <i class="bi bi-book-open me-1"></i>Mở
                                </a>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(materials)}"
                             class="text-center text-muted py-5" style="font-size:.85rem;">
                            <i class="bi bi-inbox d-block" style="font-size:2.2rem;opacity:.3;margin-bottom:10px;"></i>
                            Lesson chưa có tài liệu được publish.
                        </div>
                    </div>
                </div>

                <!-- Quiz -->
                <div class="col-lg-5 si si-3">
                    <div class="section-card h-100">
                        <div class="section-header">
                            <div class="section-header-icon" style="background:#fef3c7;">
                                <i class="bi bi-patch-question-fill text-warning"></i>
                            </div>
                            <h2>Bài kiểm tra</h2>
                            <span class="count-chip" th:text="${#lists.size(quizzes) + ' quiz'}">0</span>
                        </div>

                        <div th:unless="${#lists.isEmpty(quizzes)}">
                            <div class="quiz-item" th:each="quiz : ${quizzes}">
                                <div class="quiz-title" th:text="${quiz.title}">Quiz title</div>
                                <div class="quiz-desc"
                                     th:text="${#strings.isEmpty(quiz.description) ? 'Kiểm tra nhanh sau bài học.' : quiz.description}">Desc</div>
                                <div class="quiz-meta">
                                    <span class="quiz-meta-item">
                                        <i class="bi bi-clock"></i>
                                        <span th:text="${quiz.deadline != null ? #dates.format(quiz.deadline,'dd/MM/yyyy') : 'Không giới hạn'}">Deadline</span>
                                    </span>
                                    <span class="quiz-meta-item orange">
                                        <i class="bi bi-repeat"></i>
                                        <span th:text="${quiz.submittedAttempts + '/' + quiz.maxAttempts + ' lượt'}">0/1</span>
                                    </span>
                                </div>
                                <div class="quiz-actions">
                                    <a class="btn-quiz-do"
                                       th:if="${not quiz.deadlinePassed and quiz.submittedAttempts lt quiz.maxAttempts}"
                                       th:href="@{/student/quizzes/{id}(id=${quiz.quizId})}">
                                        <i class="bi bi-pencil-square me-1"></i>Làm quiz
                                    </a>
                                    <a class="btn-quiz-result"
                                       th:href="@{/student/quizzes/{id}/results(id=${quiz.quizId})}">
                                        <i class="bi bi-bar-chart me-1"></i>Kết quả
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(quizzes)}"
                             class="text-center text-muted py-5" style="font-size:.85rem;">
                            <i class="bi bi-clipboard-x d-block" style="font-size:2.2rem;opacity:.3;margin-bottom:10px;"></i>
                            Chưa có quiz được publish.
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
