# ===============================
# APPLICATION
# ===============================
spring:
  application:
    name: FLearn_SpringBoot

  # ===============================
  # SQL SERVER DATABASE
  # ===============================
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=FLearnDB;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update

      # Giữ nguyên tên bảng/cột theo Entity
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  # ===============================
  # THYMELEAF
  # ===============================
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8

  # ===============================
  # DEVTOOLS
  # ===============================
  devtools:
    restart:
      enabled: false   # Tắt DevTools restart để tránh xung đột MapStruct classloader

  # ===============================
  # ENCODING
  # ===============================
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # ===============================
  # SPRING MAIL - GMAIL SMTP
  # ===============================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ductrong26105@gmail.com
    password: wlijeclcejwenrph


    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true


# ===============================
# SERVER
# ===============================
server:
  port: 8080
  tomcat:
    max-http-form-post-size: -1   # -1 = không giới hạn POST size (cho phép upload file lớn)
  servlet:
    session:
      persistent: false   # Tắt ghi session ra file khi restart → tránh StreamCorruptedException

# ===============================
# LOGGING
# ===============================
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace